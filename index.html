<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Hustle V6 - Auto Weekly Reset</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;overflow:hidden}
#game{position:relative;width:100vw;height:100vh;background:linear-gradient(#87CEEB,#E0F6FF);overflow:hidden}
#player{position:absolute;width:50px;height:50px;background:#FFD700;border-radius:50%;left:50px;bottom:100px;z-index:10;border:3px solid #000}
.obstacle{position:absolute;width:40px;height:40px;background:red;bottom:100px}
.coin{position:absolute;width:30px;height:30px;background:gold;border-radius:50%;bottom:120px;border:2px solid #000}
#score{position:absolute;top:10px;left:10px;font-size:24px;font-weight:bold;color:#000;z-index:100}
#tournament{position:absolute;top:0;width:100%;background:linear-gradient(90deg,#FF6B00,#FFD700);color:#000;text-align:center;padding:8px;font-weight:bold;font-size:14px;z-index:100}
#leaderboard{position:absolute;top:50px;right:10px;background:rgba(0,0,0,0.85);padding:10px;border-radius:10px;min-width:180px;z-index:100;font-size:13px}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:center;gap:20px;z-index:100}
.btn{padding:15px 25px;background:#FF6B00;color:#fff;border:none;border-radius:10px;font-weight:bold}
#support{position:absolute;bottom:80px;left:10px;background:rgba(0,0,0,0.8);padding:8px;border-radius:8px;z-index:100}
#support a{color:#25D366;text-decoration:none;font-weight:bold}
#prizeBtn{position:absolute;bottom:80px;right:10px;background:#25D366;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:bold;z-index:100}
</style>
</head>
<body>
<div id="game">
<div id="tournament">🏆 WEEK <span id="weekNum">1</span> TOURNAMENT - TOP 3 WIN ₦500 AIRTIME SUNDAY 8PM! AUTO RESET MONDAY!</div>
<div id="score">₦0</div>
<div id="leaderboard"><b>🔥 THIS WEEK</b><div id="board">Loading...</div></div>
<div id="player"></div>
<div id="support">💛 Support Dev<br><a href="https://wa.me/2348125563943?text=I%20support%20Lagos%20Hustle%20V6">Opay: 8125563943</a></div>
<button id="prizeBtn" onclick="claimPrize()">🎁 Claim Prize</button>
<div id="controls"><button class="btn" onclick="jump()">JUMP</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC7r7-cFxiZAL79q3r6u6d9o6X9v6dX8y8",
authDomain: "lagos-hustle-a27d7.firebaseapp.com",
projectId: "lagos-hustle-a27d7",
storageBucket: "lagos-hustle-a27d7.appspot.com",
messagingSenderId: "123456789",
appId: "1:123456789:web:abcdef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// AUTO WEEK CALCULATION - resets every Monday
function getWeekStart(){
let now=new Date();
let day=now.getDay();
let diff=now.getDate()-day+(day==0?-6:1);
let monday=new Date(now.setDate(diff));
monday.setHours(0,0,0,0);
return monday;
}
function getWeekNumber(){
let start=new Date(new Date().getFullYear(),0,1);
let days=Math.floor((new Date()-start)/(24*60*60*1000));
return Math.ceil((days+start.getDay()+1)/7);
}
document.getElementById('weekNum').innerText=getWeekNumber();
let weekStart=getWeekStart();

let player=document.getElementById('player');
let game=document.getElementById('game');
let scoreEl=document.getElementById('score');
let score=0;
let isJumping=false;

function jump(){
if(isJumping) return;
isJumping=true;
let up=0;
let j=setInterval(()=>{
if(up>=120){clearInterval(j); let d=setInterval(()=>{if(up<=0){clearInterval(d);isJumping=false;} up-=10; player.style.bottom=(100+up)+'px';},20);}else{up+=10; player.style.bottom=(100+up)+'px';}
},20);
}

function createObstacle(){
let obs=document.createElement('div');
obs.className='obstacle';
obs.style.left='100vw';
game.appendChild(obs);
let move=setInterval(()=>{
let l=parseInt(obs.style.left);
if(l<-50){clearInterval(move);obs.remove();}
else{obs.style.left=(l-5)+'px';
let pRect=player.getBoundingClientRect();
let oRect=obs.getBoundingClientRect();
if(!(pRect.right<oRect.left||pRect.left>oRect.right||pRect.bottom<oRect.top||pRect.top>oRect.bottom)){gameOver();clearInterval(move);}}
},20);
}

function createCoin(){
let coin=document.createElement('div');
coin.className='coin';
coin.style.left='100vw';
coin.style.bottom=(120+Math.random()*100)+'px';
game.appendChild(coin);
let move=setInterval(()=>{
let l=parseInt(coin.style.left);
if(l<-50){clearInterval(move);coin.remove();}
else{coin.style.left=(l-5)+'px';
let pRect=player.getBoundingClientRect();
let cRect=coin.getBoundingClientRect();
if(!(pRect.right<cRect.left||pRect.left>cRect.right||pRect.bottom<cRect.top||pRect.top>cRect.bottom)){score+=10;scoreEl.innerText='₦'+score;coin.remove();clearInterval(move);}}
},20);
}

setInterval(createObstacle,1500);
setInterval(createCoin,1000);

async function loadBoard(){
try{
let q=query(collection(db,"leaderboard"),orderBy("score","desc"),limit(50));
let snap=await getDocs(q);
let html="";
let count=0;
snap.forEach(doc=>{
let d=doc.data();
let created=d.created?d.created.toDate():new Date(0);
if(created>=weekStart||!d.created){
count++;
if(count<=10) html+=`${count}. ${d.name} ₦${d.score}<br>`;
}
});
if(count==0) html="No scores this week<br>Be first!";
document.getElementById('board').innerHTML=html;
}catch(e){document.getElementById('board').innerHTML="Offline - ₦"+score;}
}

async function gameOver(){
let name=prompt("Game Over! You scored ₦"+score+"\nEnter name for WEEK "+getWeekNumber()+" leaderboard:");
if(name){
try{await addDoc(collection(db,"leaderboard"),{name:name.substring(0,12),score:score,created:serverTimestamp()});}catch(e){alert("Saved locally!");}
}
score=0;scoreEl.innerText='₦0';loadBoard();
}

window.claimPrize=()=>{
let msg=`Hello! I am claiming Lagos Hustle Week ${getWeekNumber()} prize! My score is ₦${score}. Check leaderboard!`;
window.open(`https://wa.me/2348125563943?text=${encodeURIComponent(msg)}`);
}

loadBoard();
setInterval(loadBoard,5000);
</script>
</body>
</html>
