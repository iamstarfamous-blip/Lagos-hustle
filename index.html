<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Hustle - Global Leaderboard</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0294J85BMB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0294J85BMB');
</script>

<!-- Firebase SDK -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>

<style>
  body { margin:0; background:#0f0f0f; color:white; font-family: 'Segoe UI', sans-serif; text-align:center; }
  #game { padding:20px; }
  canvas { background:#1a1a1a; border:2px solid #ffcc00; border-radius:10px; max-width:100%; }
  .stats { font-size:22px; margin:15px; color:#ffcc00; }
  button { background:#ffcc00; color:#000; border:none; padding:12px 25px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; margin:10px; }
  #leaderboard { background:#222; max-width:400px; margin:20px auto; padding:15px; border-radius:10px; text-align:left; }
  #leaderboard h2 { text-align:center; color:#ffcc00; }
  .entry { padding:8px; border-bottom:1px solid #333; display:flex; justify-content:space-between; }
  .entry.top1 { color:gold; font-weight:bold; }
  input { padding:10px; border-radius:5px; border:none; width:70%; font-size:16px; }
</style>
</head>
<body>

<div id="game">
  <h1>🇳🇬 LAGOS HUSTLE</h1>
  <div class="stats">Cash: ₦<span id="cash">0</span> | Level: <span id="level">1</span></div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div>
    <button onclick="tapHustle()">HUSTLE 💰</button>
    <button onclick="resetGame()">Reset</button>
  </div>

  <div id="saveScoreBox" style="display:none; background:#222; padding:15px; max-width:400px; margin:20px auto; border-radius:10px;">
    <h3>Game Over! Save Your Score</h3>
    <input id="playerName" placeholder="Enter your name (e.g. Star)" maxlength="15">
    <button onclick="saveGlobalScore()">Save to Global Leaderboard 🌍</button>
  </div>

  <div id="leaderboard">
    <h2>🏆 GLOBAL TOP 10</h2>
    <div id="leaderboardList">Loading global hustlers...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "firebase/firestore";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCdmLasZpFtzhfTjn65dyggLxsNCTkHuZI",
    authDomain: "lagos-hustle-a27d7.firebaseapp.com",
    projectId: "lagos-hustle-a27d7",
    storageBucket: "lagos-hustle-a27d7.firebasestorage.app",
    messagingSenderId: "737760929025",
    appId: "1:737760929025:web:ab7221ad816c83accba700"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // GAME LOGIC
  let cash = parseInt(localStorage.getItem('cash')) || 0;
  let level = 1;
  let gameActive = true;

  const cashEl = document.getElementById('cash');
  const levelEl = document.getElementById('level');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function updateUI() {
    cashEl.textContent = cash.toLocaleString();
    levelEl.textContent = level;
    localStorage.setItem('cash', cash);
    draw();
  }

  function draw() {
    ctx.clearRect(0,0,400,600);
    ctx.fillStyle = "#ffcc00";
    ctx.font = "60px Arial";
    ctx.textAlign = "center";
    ctx.fillText("💰", 200, 300);
    ctx.font = "20px Arial";
    ctx.fillText(`₦${cash.toLocaleString()}`, 200, 350);
  }

  window.tapHustle = () => {
    if(!gameActive) return;
    cash += 100 * level;
    if(cash > level * 5000) level++;
    gtag('event', 'hustle_tap', { value: cash });
    updateUI();
    if(cash > 50000 && gameActive) {
      gameActive = false;
      document.getElementById('saveScoreBox').style.display = 'block';
    }
  }

  window.resetGame = () => {
    cash = 0; level = 1; gameActive = true;
    document.getElementById('saveScoreBox').style.display = 'none';
    updateUI();
  }

  // GLOBAL LEADERBOARD
  async function loadLeaderboard() {
    const list = document.getElementById('leaderboardList');
    try {
      const q = query(collection(db, "leaderboard"), orderBy("cash", "desc"), limit(10));
      const snapshot = await getDocs(q);
      list.innerHTML = "";
      let rank = 1;
      snapshot.forEach(doc => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = `entry ${rank===1?'top1':''}`;
        div.innerHTML = `<span>${rank}. ${data.name}</span><span>₦${data.cash.toLocaleString()}</span>`;
        list.appendChild(div);
        rank++;
      });
      if(rank===1) list.innerHTML = "No scores yet. Be the first!";
    } catch(e) {
      list.innerHTML = "Error loading leaderboard. Check Firestore rules.";
      console.error(e);
    }
  }

  window.saveGlobalScore = async () => {
    const name = document.getElementById('playerName').value.trim() || "Anonymous";
    if(cash===0) return alert("No cash to save!");
    try {
      await addDoc(collection(db, "leaderboard"), {
        name: name,
        cash: cash,
        createdAt: serverTimestamp()
      });
      gtag('event', 'save_global_score', { player: name, cash: cash });
      alert(`Saved! ${name} - ₦${cash.toLocaleString()} to global board!`);
      document.getElementById('saveScoreBox').style.display = 'none';
      loadLeaderboard();
      resetGame();
    } catch(e) {
      alert("Failed to save. Make sure Firestore is in test mode.");
      console.error(e);
    }
  }

  // Init
  updateUI();
  loadLeaderboard();
</script>
</body>
</html>
