<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lagos Hustle V2 - Global</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;background:#080e0a}
#header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#000a;backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid #ffffff11}
.logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:2px}.logo span{color:#00ff88}
#score{font-weight:900;font-size:20px;background:#00ff88;color:#000;padding:8px 18px;border-radius:30px}
canvas{flex:1;width:100%;display:block}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:22px;padding:0 16px;z-index:10;pointer-events:none}
.cbtn{pointer-events:auto;width:78px;height:78px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff28;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;user-select:none}
.cbtn:active{transform:scale(0.92);background:#00ff8844}
#overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, #123122 0%, #000 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:22px;text-align:center}
h1{font-family:'Bebas Neue';font-size:64px;line-height:0.85;margin-bottom:10px} h1 span{color:#00ff88}
.sub{opacity:0.65;margin-bottom:18px;max-width:320px;line-height:1.4;font-size:15px}
.inputRow{display:flex;width:100%;max-width:340px;margin-bottom:14px}
input{flex:1;background:#111;border:2px solid #222;border-radius:14px;padding:16px;color:#fff;font-weight:800;outline:none;font-size:16px}
input:focus{border-color:#00ff88}
#mainBtn{background:#00ff88;color:#000;border:none;padding:18px 36px;border-radius:100px;font-weight:900;font-size:18px;width:100%;max-width:340px;letter-spacing:0.5px}
#board{width:100%;max-width:360px;margin-top:18px;background:#0f0f0f;border:1px solid #222;border-radius:18px;padding:12px;max-height:36vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:4px;background:#ffffff06}
.row:nth-child(1){background:#00ff8826;border:1px solid #00ff8844;font-weight:900;font-size:15px}
.row.me{border:1px dashed #00ff88;background:#00ff8811}
.small{font-size:11px;opacity:0.4;margin-top:10px;letter-spacing:1px}
.hint{position:absolute;top:70px;width:100%;text-align:center;opacity:0.35;font-size:12px;letter-spacing:3px;z-index:5}
</style>
</head>
<body>
<div id="wrap">
<div id="header"><div class="logo">LAGOS <span>HUSTLE</span></div><div id="score">₦0</div></div>
<div class="hint">◀ SWIPE LANES • TAP JUMP ▶</div>
<canvas id="c"></canvas>
<div id="controls"><div class="cbtn" id="l">←</div><div class="cbtn" id="j">JUMP</div><div class="cbtn" id="r">→</div></div>
<div id="overlay">
<h1>LAGOS<br><span>HUSTLE</span></h1>
<div class="sub">Dodge yellow danfo, grab ₦, become street king. Global leaderboard live!</div>
<div class="inputRow"><input id="name" placeholder="Your street name" maxlength="12"></div>
<button id="mainBtn">START HUSTLE</button>
<div id="board"><div style="opacity:.5;text-align:center;padding:14px">Loading global board...</div></div>
<div class="small">V2 • FIRESTORE LIVE • LAGOS-HUSTLE-A27D7</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCdmLasZpFtzhfTjn65dyggLxsNCTkHuZI", authDomain: "lagos-hustle-a27d7.firebaseapp.com", projectId: "lagos-hustle-a27d7", storageBucket: "lagos-hustle-a27d7.firebasestorage.app", messagingSenderId: "737760929025", appId: "1:737760929025:web:ab7221ad816c83accba700" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const lbRef = collection(db, "leaderboard");
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
let W,H,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2); W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize); setTimeout(resize,50);
const scoreEl=document.getElementById('score'), overlay=document.getElementById('overlay'), nameInput=document.getElementById('name'), mainBtn=document.getElementById('mainBtn'), board=document.getElementById('board');
let state='menu', score=0, speed=0, frame=0, player, obs=[], cash=[], lanes=3;
class Player{
  constructor(){this.lane=1; this.y=H-150; this.vy=0; this.groundY=H-150; this.onGround=true; this.w=50; this.h=62;}
  get x(){return (W/lanes)*this.lane + (W/lanes)/2 - this.w/2;}
  jump(){if(this.onGround){this.vy=-18; this.onGround=false;}}
  update(){if(!this.onGround){this.vy+=0.95; this.y+=this.vy; if(this.y>=this.groundY){this.y=this.groundY; this.vy=0; this.onGround=true;}}}
  draw(){
    ctx.save(); ctx.translate(this.x+this.w/2, this.y+this.h/2);
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(-22, this.h/2-6, 44, 8);
    ctx.fillStyle='#00ff88'; ctx.fillRect(-22,-30,44,50);
    ctx.fillStyle='#ffdbac'; ctx.fillRect(-14,-46,28,20);
    ctx.fillStyle='#000'; ctx.fillRect(-10,-36,6,4); ctx.fillRect(4,-36,6,4);
    ctx.restore();
  }
}
function spawnObs(){const lane=Math.floor(Math.random()*lanes); obs.push({lane, y:-100, w:70, h:48, type:'danfo'});}
function spawnCash(){const lane=Math.floor(Math.random()*lanes); cash.push({lane, y:-80, w:44, h:44});}
function drawRoad(){
  ctx.fillStyle='#151515'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0e0e0e'; for(let i=0;i<lanes;i++){ctx.fillRect((W/lanes)*i+4,0,W/lanes-8,H);}
  ctx.strokeStyle='#2a2a2a'; ctx.setLineDash([28,28]); ctx.lineWidth=3;
  for(let i=1;i<lanes;i++){ctx.beginPath(); ctx.moveTo((W/lanes)*i,0); ctx.lineTo((W/lanes)*i,H); ctx.stroke();}
  ctx.setLineDash([]); ctx.lineWidth=1;
}
function loop(){
  if(state!=='play')return;
  frame++; drawRoad();
  speed+=0.004; score+=1; scoreEl.textContent='₦'+score;
  if(frame%70===0)spawnObs();
  if(frame%55===0)spawnCash();
  player.update(); player.draw();
  for(let i=obs.length-1;i>=0;i--){let o=obs[i]; o.y+=5+speed*4;
    let ox=(W/lanes)*o.lane + (W/lanes)/2 - o.w/2;
    ctx.fillStyle='#ffcc00'; ctx.fillRect(ox,o.y,o.w,o.h);
    ctx.fillStyle='#000'; ctx.fillRect(ox+4,o.y+6,o.w-8,12);
    ctx.fillStyle='#333'; ctx.fillRect(ox+6,o.y+o.h-10,14,8); ctx.fillRect(ox+o.w-20,o.y+o.h-10,14,8);
    if(o.y>H+100){obs.splice(i,1); continue;}
    if(o.lane===player.lane && o.y+o.h>player.y+12 && o.y<player.y+player.h-6){return endGame();}
  }
  for(let i=cash.length-1;i>=0;i--){let c=cash[i]; c.y+=5+speed*4;
    let cx=(W/lanes)*c.lane + (W/lanes)/2 - c.w/2;
    ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(cx+c.w/2,c.y+c.h/2,18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='900 18px Inter'; ctx.fillText('₦',cx+13,c.y+27);
    ctx.strokeStyle='#00ff8844'; ctx.lineWidth=3; ctx.stroke();
    if(c.y>H+100){cash.splice(i,1); continue;}
    if(c.lane===player.lane && c.y+c.h>player.y && c.y<player.y+player.h){score+=150; cash.splice(i,1); if(navigator.vibrate)navigator.vibrate(30);}
  }
  requestAnimationFrame(loop);
}
async function loadBoard(meScore=null, meName=null){
  try{
    const q=query(lbRef, orderBy('score','desc'), limit(20));
    const snap=await getDocs(q);
    let html=''; let rank=1;
    snap.forEach(d=>{const v=d.data(); const isMe=meScore!==null && v.name===meName && v.score===meScore; html+=`<div class="row ${isMe?'me':''}"><span>${rank}. ${v.name||'Anon'}</span><span>₦${v.score}</span></div>`; rank++;});
    if(!html)html='<div style="opacity:.5;text-align:center">No scores yet. Be first!</div>';
    board.innerHTML=html;
  }catch(e){board.innerHTML='<div style="opacity:.5">Board error: '+e.message+'</div>';}
}
async function saveScore(name,val){try{await addDoc(lbRef,{name:name.slice(0,12)||'Anon',score:val,created:serverTimestamp()});}catch(e){}}
async function endGame(){
  state='over'; const name=nameInput.value||'Anon';
  overlay.style.display='flex';
  document.querySelector('#overlay h1').innerHTML=`YOU HUSTLED<br><span>₦${score}</span>`;
  document.querySelector('.sub').textContent= score>2000?'STREET LEGEND! 👑':'Danfo jam you! Try again';
  mainBtn.textContent='HUSTLE AGAIN';
  if(score>30)await saveScore(name,score);
  await loadBoard(score,name);
}
function start(){
  if(!nameInput.value.trim()){nameInput.style.borderColor='#ff4444'; nameInput.placeholder='Enter name first!'; return;}
  localStorage.setItem('lagos_name',nameInput.value);
  score=0; speed=0; frame=0; obs=[]; cash=[]; player=new Player();
  state='play'; overlay.style.display='none'; loop();
}
mainBtn.addEventListener('click',start);
document.getElementById('j').addEventListener('touchstart',e=>{e.preventDefault(); if(state==='play')player?.jump();},{passive:false});
document.getElementById('j').addEventListener('click',()=>{if(state==='play')player?.jump();});
document.getElementById('l').addEventListener('touchstart',e=>{e.preventDefault(); player.lane=Math.max(0,player.lane-1);},{passive:false});
document.getElementById('r').addEventListener('touchstart',e=>{e.preventDefault(); player.lane=Math.min(2,player.lane+1);},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')player?.jump(); if(e.code==='ArrowLeft')player.lane=Math.max(0,player.lane-1); if(e.code==='ArrowRight')player.lane=Math.min(2,player.lane+1);});
canvas.addEventListener('touchstart',e=>{if(state==='play'&&e.touches[0].clientY < H*0.7)player?.jump();},{passive:true});
loadBoard();
nameInput.value=localStorage.getItem('lagos_name')||'Oluwadamilol';
</script>
</body>
</html>
