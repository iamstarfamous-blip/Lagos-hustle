<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagos Hustle</title>
<style>
body{background:#1e2a9d;color:white;font-family:sans-serif;text-align:center;padding:20px}
h1{font-size:30px}
#cash{color:#00ff88;font-size:36px;font-weight:bold}
button{width:100%;padding:15px;margin:8px 0;background:#ffcc00;border:none;border-radius:10px;font-size:18px;font-weight:bold}
#reset{background:#ff4444;color:white}
</style>
</head>
<body>
<h1>🚕 LAGOS HUSTLE</h1>
<p>Tap to hustle! Buy assets and become a Lagos Big Boy</p>
<div>
Cash Balance<br>
<div id="cash">₦0</div>
<p id="level">Level: New Hustler</p>
</div>
<button onclick="hustle()">💰 HUSTLE +₦500</button>
<button onclick="buy('Keke',2000)">🛺 Buy Keke - ₦2,000</button>
<button onclick="buy('Danfo Bus',5000)">🚌 Buy Danfo Bus - ₦5,000</button>
<button onclick="buy('Shop',10000)">🏪 Buy Shop - ₦10,000</button>
<button onclick="buy('Land in Lekki',20000)">🏠 Buy Land in Lekki - ₦20,000</button>
<button onclick="buy('Range Rover',50000)">🚙 Buy Range Rover - ₦50,000</button>
<button onclick="buy('Mansion',100000)">🏛️ Buy Mansion - ₦100,000</button>
<button onclick="buy('Yacht',250000)">🛥️ Buy Yacht - ₦250,000</button>
<p id="msg">You hustled in traffic! +₦500</p>
<p id="assets">Assets: None</p>
<button id="reset" onclick="reset()">🔄 Reset Game</button>
<script>
let cash = Number(localStorage.getItem('cash')) || 0;
let assets = JSON.parse(localStorage.getItem('assets')) || [];
function save(){ localStorage.setItem('cash', cash); localStorage.setItem('assets', JSON.stringify(assets)); }
function update(){
 document.getElementById('cash').textContent = '₦' + cash.toLocaleString();
 let level = cash < 10000 ? 'New Hustler' : cash < 50000 ? 'Street Boss' : cash < 200000 ? 'Lagos King' : 'Lagos Billionaire';
 document.getElementById('level').textContent = 'Level: ' + level;
 document.getElementById('assets').textContent = 'Assets: ' + (assets.length ? assets.join(', ') : 'None');
}
function hustle(){ cash += 500; document.getElementById('msg').textContent = 'You hustled in traffic! +₦500'; save(); update(); }
function buy(name, cost){
 if(cash >= cost){ cash -= cost; assets.push(name); document.getElementById('msg').textContent = 'You bought ' + name + '!'; }
 else { document.getElementById('msg').textContent = 'Not enough cash for ' + name; }
 save(); update();
}
function reset(){ if(confirm('Reset all money and assets?')){ cash = 0; assets = []; save(); update(); } }
update();
</script>
</body>
</html>
