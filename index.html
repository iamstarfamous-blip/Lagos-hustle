<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagos Hustle</title>
<style>
body{background:#1e2a9d;color:white;font-family:sans-serif;text-align:center;padding:20px}
h1{font-size:30px}
#cash{color:#00ff88;font-size:36px;font-weight:bold;transition:transform.2s}
#cash.pop{transform:scale(1.2)}
#event{background:#ffcc00;color:black;padding:10px;border-radius:8px;margin:10px 0;font-weight:bold}
button{width:100%;padding:15px;margin:8px 0;background:#ffcc00;border:none;border-radius:10px;font-size:18px;font-weight:bold}
button:active{transform:scale(.95);background:#00ff88}
#reset{background:#ff4444;color:white}
#bankBox{background:#00ff88;color:black;padding:15px;border-radius:10px;margin:10px 0;font-weight:bold}
input{width:80%;padding:10px;border-radius:8px;border:none;margin:5px 0}
#shareBtn{background:#25D366;color:white}
#supportBtn{background:#ff0000;color:white}
</style>
</head>
<body>
<h1>🚕 LAGOS HUSTLE</h1>
<p>Tap to hustle! Assets earn money every second.</p>
<div>
Cash Balance<br>
<div id="cash">₦0</div>
<p id="level">Level: New Hustler</p>
<p id="income">Income: ₦0 / sec</p>
</div>
<div id="event">⏳ Lagos event coming soon...</div>
<button onclick="hustle()">💰 HUSTLE +₦500</button>
<button id="shareBtn" onclick="shareScore()">📱 Share Score</button>
<button id="supportBtn" onclick="window.open('https://paystack.com/buy/lagos-hustle-support-rnkbus','_blank')">❤️ Support the Creator</button>
<div id="bankBox">
🏦 Bank Balance: <span id="bank">₦0</span><br>
Interest: 5% every 10 minutes<br>
<input type="number" id="bankAmount" placeholder="Amount to deposit/withdraw" min="1">
<button onclick="deposit()">💰 Deposit</button>
<button onclick="withdraw()">💸 Withdraw</button>
</div>
<button onclick="buy('Keke',2000,10)">🛺 Buy Keke - ₦2,000 (+₦10/sec)</button>
<button onclick="buy('Danfo Bus',5000,30)">🚌 Buy Danfo Bus - ₦5,000 (+₦30/sec)</button>
<button onclick="buy('Shop',10000,80)">🏪 Buy Shop - ₦10,000 (+₦80/sec)</button>
<button onclick="buy('Land in Lekki',20000,150)">🏠 Buy Land in Lekki - ₦20,000 (+₦150/sec)</button>
<button onclick="buy('Range Rover',50000,400)">🚙 Buy Range Rover - ₦50,000 (+₦400/sec)</button>
<button onclick="buy('Mansion',100000,1000)">🏛️ Buy Mansion - ₦100,000 (+₦1,000/sec)</button>
<button onclick="buy('Yacht',250000,3000)">🛥️ Buy Yacht - ₦250,000 (+₦3,000/sec)</button>
<button onclick="buy('Island Estate',1000000,10000)">🏝️ Buy Island Estate - ₦1,000,000 (+₦10,000/sec)</button>
<p id="msg">You hustled in traffic! +₦500</p>
<p id="assets">Assets: None</p>
<button id="reset" onclick="reset()">🔄 Reset Game</button>
<script>
let cash = Number(localStorage.getItem('cash')) || 0;
let assets = JSON.parse(localStorage.getItem('assets')) || [];
let income = Number(localStorage.getItem('income')) || 0;
let bank = Number(localStorage.getItem('bank')) || 0;
let lastVisit = Number(localStorage.getItem('lastVisit')) || Date.now();
let offlineEarnings = Math.floor((Date.now() - lastVisit) / 1000) * income;
if(offlineEarnings > 0){ cash += offlineEarnings; alert('Welcome back! You earned ₦' + offlineEarnings.toLocaleString() + ' while you were away!'); }
function save(){ localStorage.setItem('cash', cash); localStorage.setItem('assets', JSON.stringify(assets)); localStorage.setItem('income', income); localStorage.setItem('bank', bank); localStorage.setItem('lastVisit', Date.now()); }
function pop(){ let el = document.getElementById('cash'); el.classList.add('pop'); setTimeout(function(){ el.classList.remove('pop'); }, 200); }
function beep(){ try{ let c = new AudioContext(); let o = c.createOscillator(); o.frequency.value = 880; o.connect(c.destination); o.start(); o.stop(c.currentTime + 0.15); }catch(e){} }
function update(){
 document.getElementById('cash').textContent = '₦' + cash.toLocaleString();
 document.getElementById('bank').textContent = '₦' + bank.toLocaleString();
 document.getElementById('income').textContent = 'Income: ₦' + income.toLocaleString() + ' / sec';
 let level = cash < 10000? 'New Hustler' : cash < 50000? 'Street Boss' : cash < 200000? 'Lagos King' : 'Lagos Billionaire';
 document.getElementById('level').textContent = 'Level: ' + level;
 document.getElementById('assets').textContent = 'Assets: ' + (assets.length? assets.join(', ') : 'None');
}
function hustle(){ cash += 500; pop(); document.getElementById('msg').textContent = 'You hustled in traffic! +₦500'; save(); update(); }
function shareScore(){
 let level = cash < 10000? 'New Hustler' : cash < 50000? 'Street Boss' : cash < 200000? 'Lagos King' : 'Lagos Billionaire';
 let msg = 'I just made ₦' + cash.toLocaleString() + ' in Lagos Hustle! My level is ' + level + ' and I earn ₦' + income.toLocaleString() + '/sec. Can you beat me? Play now: https://iamstarfamous-blip.github.io/Lagos-hustle/';
 if(navigator.share){ navigator.share({title:'Lagos Hustle Score', text:msg, url:'https://iamstarfamous-blip.github.io/Lagos-hustle/'}); }
 else { window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'); }
}
function supportMe(){
 window.open('https://paystack.shop/pay/k5359h5b95', '_blank');
}
function deposit(){
 let amt = Number(document.getElementById('bankAmount').value);
 if(amt > 0 && cash >= amt){ cash -= amt; bank += amt; pop(); beep(); document.getElementById('msg').textContent = 'Deposited ₦' + amt.toLocaleString() + ' to Bank'; }
 else { document.getElementById('msg').textContent = 'Not enough cash or enter a valid amount'; }
 save(); update();
}
function withdraw(){
 let amt = Number(document.getElementById('bankAmount').value);
 if(amt > 0 && bank >= amt){ bank -= amt; cash += amt; pop(); beep(); document.getElementById('msg').textContent = 'Withdrew ₦' + amt.toLocaleString() + ' from Bank'; }
 else { document.getElementById('msg').textContent = 'Not enough Bank balance or enter a valid amount'; }
 save(); update();
}
function buy(name, cost, inc){
 if(cash >= cost){ cash -= cost; assets.push(name); income += inc; pop(); beep(); document.getElementById('msg').textContent = 'You bought ' + name + '! +' + inc + '/sec'; }
 else { document.getElementById('msg').textContent = 'Not enough cash for ' + name; }
 save(); update();
}
function reset(){ if(confirm('Reset all money and assets?')){ cash = 0; assets = []; income = 0; bank = 0; save(); update(); } }
setInterval(function(){ if(income > 0){ cash += income; save(); update(); } }, 1000);
setInterval(function(){ if(bank > 0){ let interest = Math.floor(bank * 0.05); bank += interest; document.getElementById('msg').textContent = 'Bank interest! +₦' + interest.toLocaleString(); save(); update(); } }, 600000);
function event(){
 let events = [
  ['You dodged Lekki traffic! +₦5,000', 5000],
  ['Danfo driver gave you a free ride! +₦2,000', 2000],
  ['You sold bottled water in traffic! +₦3,000', 3000],
  ['You won Lagos lottery! +₦10,000', 10000],
  ['Area boy tax! -₦1,000', -1000],
  ['Car breakdown on Third Mainland! -₦2,000', -2000]
 ];
 let e = events[Math.floor(Math.random() * events.length)];
 cash += e[1]; if(cash < 0) cash = 0;
 document.getElementById('event').textContent = '🚨 ' + e[0];
 document.getElementById('msg').textContent = e[0];
 pop(); save(); update();
}
setInterval(event, 20000);
update();
</script>
</body>
</html>
