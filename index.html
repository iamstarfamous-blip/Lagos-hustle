<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Hustle Week 41</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;background:#0a2e0a;color:white;text-align:center;padding:15px}
.card{background:#111;border:2px solid #ffd700;border-radius:15px;padding:20px;max-width:400px;margin:20px auto}
input{width:90%;padding:12px;margin:8px;border-radius:8px;border:none;font-size:16px}
button{background:#ffd700;color:black;padding:14px 30px;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;width:95%;margin-top:10px}
.leaderboard{background:#222;border-radius:10px;padding:15px;margin-top:20px;text-align:left}
.leader-item{padding:8px;border-bottom:1px solid #444;display:flex;justify-content:space-between}
</style>
</head>
<body>
<h1>🔥 LAGOS HUSTLE 🔥</h1>
<p>PAY ₦100 - WIN ₦500 AIRTIME - TOP 3 SUNDAY 8PM</p>
<div class="card" id="registerCard">
<h3>Enter to Play</h3>
<input type="text" id="playerName" placeholder="Your Name">
<input type="tel" id="playerPhone" placeholder="Phone for Airtime e.g. 08012345678" maxlength="11">
<button onclick="payAndPlay()">Pay ₦100 & Play Now</button>
</div>
<div class="card" id="gameCard" style="display:none">
<h3>Welcome <span id="displayName"></span>!</h3>
<p>Phone: <span id="displayPhone"></span></p>
<p>Score: <span id="score">0</span></p>
<button onclick="addScore()">Tap to Hustle! +10 🔥</button>
<button onclick="saveScore()" style="background:green;color:white">Save Score</button>
</div>
<div class="card leaderboard">
<h3>🏆 Leaderboard Week 41</h3>
<div id="leaderList">No scores yet</div>
</div>
<script>
let currentScore=0;
let players=JSON.parse(localStorage.getItem('lh_players')||'[]');
function payAndPlay(){
 let name=document.getElementById('playerName').value.trim();
 let phone=document.getElementById('playerPhone').value.trim();
 if(!name){alert('Enter name');return}
 if(!phone||phone.length!=11){alert('Enter 11 digit phone');return}
 let email=name.replace(/\s/g,'')+phone+'@lagoshustle.com';
 let handler=PaystackPop.setup({
   key:'pk_live_df8006f82ece6bedf874889283b5b65c1f35ac64',
   email:email,amount:10000,currency:'NGN',
   ref:'LH41_'+Math.floor(Math.random()*1000000000),
   callback:function(res){
     document.getElementById('registerCard').style.display='none';
     document.getElementById('gameCard').style.display='block';
     document.getElementById('displayName').innerText=name;
     document.getElementById('displayPhone').innerText=phone;
     localStorage.setItem('lh_current_name',name);
     localStorage.setItem('lh_current_phone',phone);
     currentScore=0;document.getElementById('score').innerText=0;
   },
   onClose:function(){alert('Payment cancelled')}
 });
 handler.openIframe();
}
function addScore(){currentScore+=10;document.getElementById('score').innerText=currentScore;}
function saveScore(){
 let name=localStorage.getItem('lh_current_name');
 let phone=localStorage.getItem('lh_current_phone');
 players.push({name:name,phone:phone,score:currentScore});
 players.sort((a,b)=>b.score-a.score);
 localStorage.setItem('lh_players',JSON.stringify(players));
 renderLeader();
 alert('Saved! '+name+' - '+currentScore+'pts');
 document.getElementById('gameCard').style.display='none';
 document.getElementById('registerCard').style.display='block';
 document.getElementById('playerName').value='';document.getElementById('playerPhone').value='';
}
function renderLeader(){
 let list=document.getElementById('leaderList');
 if(players.length==0){list.innerHTML='No scores yet';return}
 let html='';
 players.slice(0,10).forEach((p,i)=>{
   html+=`<div class="leader-item"><span>${i+1}. ${p.name} - ${p.score}</span><span>${p.phone}</span></div>`;
 });
 list.innerHTML=html;
}
renderLeader();
</script>
</body>
</html>
